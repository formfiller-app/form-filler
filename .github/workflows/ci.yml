# Every push and pull request: the never-list gate, the unit and command-line tests (with a backup opened by the stock
# age tool), a build, and the whole page walked at phone size, in Chromium here and in WebKit (the engine of Safari,
# an iPhone and the Mac app) on a Mac. The Mac app's own screens are walked in both too, over a stand-in for the app,
# and the app's Rust is built and its tests run on a Mac. The app itself is not started here.
# The handwriting step is left out (it downloads a 64 MB model); run it on a computer with
#   node scripts/walk.cjs dist --handwriting
name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every commit, so the never-list gate can check each one
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # age is the stock tool a backup must open with (tests/interop.test.js).
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils age
      - run: age --version
      # The never-list gate (never-list/README.md): no personal information in any file, commit or commit message.
      - run: node scripts/never-list.mjs --all --history
      - run: npm test
        env:
          FF_REQUIRE_AGE: '1'   # tests/interop.test.js must run the stock-age check here, not skip it
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/walk.cjs dist
      # The Mac app's own screens, clicked through over a stand-in for the app (tests/tauri-stand-in.js).
      - run: node scripts/walk-mac.cjs dist
  webkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: brew install poppler
      - run: npm run build
      - run: npx playwright install webkit
      - run: node scripts/walk.cjs dist --engine webkit
      - run: node scripts/walk-mac.cjs dist --engine webkit
  mac-app:
    # The Mac app's Rust (src-tauri): built with the page it carries, and its tests run, with the versions Cargo.lock
    # pins. The app is not started.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: rustc --version
      - run: npm run mac:test
